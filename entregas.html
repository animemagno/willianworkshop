<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entregas - Taller Wilian</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/entregas.css">
</head>

<body class="main-wrapper">

    <header>
        <button class="menu-toggle" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
        <h1>Taller Willian</h1>
        <div class="header-actions">
            <!-- Sin carrito -->
        </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
        <a href="venta.html"><i class="fas fa-cash-register"></i> Nueva Venta</a>
        <a href="facturas.html"><i class="fas fa-file-invoice-dollar"></i> Facturas Pendientes</a>
        <a href="historial.html"><i class="fas fa-history"></i> Historial de Ventas</a>
        <a href="inventario.html"><i class="fas fa-boxes"></i> Inventario</a>
        <a href="servicios.html"><i class="fas fa-tools"></i> Servicios</a>
        <a href="entregas.html" class="active"><i class="fas fa-truck"></i> Entregas</a>
        <a href="cuentas.html"><i class="fas fa-sticky-note"></i> Memos y Cuentas</a>
        <a href="configuracion.html"><i class="fas fa-cog"></i> Configuración</a>
        <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
    </div>

    <div class="container">
        <div class="dashboard-section">
            <div class="section-title">GESTIÓN DE ENTREGAS</div>

            <!-- 🔥 Contenedor con ancho completo -->
            <div class="entregas-wrapper">
                <div class="entregas-actions">
                    <div>
                        <button class="btn btn-success" id="nueva-entrega-btn"><i class="fas fa-plus"></i> NUEVA
                            ENTREGA</button>
                    </div>
                    <div class="form-group">
                        <input type="text" id="buscar-entrega" placeholder="Buscar entrega...">
                    </div>
                </div>

                <div class="entregas-table-container">
                    <table class="entregas-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Equipo</th>
                                <th>Fecha</th>
                                <th>Estado</th>
                                <th width="150">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="entregas-body">
                            <!-- Llenado dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/controllers/DeliveriesController.js"></script>
</body>

</html>
