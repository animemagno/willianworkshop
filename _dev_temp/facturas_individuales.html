<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturas Individuales - Taller Willian</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/facturas.css">
</head>

<body class="main-wrapper">
    <header>
        <h1>Facturas Pendientes</h1>
    </header>

    <div class="container">
        <div class="dashboard-section">
            <h2>Facturas Individuales (Sin Grupo)</h2>
            <div id="facturas-grid"
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; margin-top: 20px;">
                <!-- Se llena dinámicamente -->
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaZdPPYddeMPTiNm5cCdFL6m9b9swX0-c",
            authDomain: "williantaller-1426b.firebaseapp.com",
            projectId: "williantaller-1426b",
            storageBucket: "williantaller-1426b.firebasestorage.app",
            messagingSenderId: "757966587061",
            appId: "1:757966587061:web:6c700e862317119d64aafc"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);

        async function cargarFacturasIndividuales() {
            const grid = document.getElementById('facturas-grid');
            const facturas = [];

            try {
                const perfilesSnap = await db.collection('PERFILES').get();

                for (const perfilDoc of perfilesSnap.docs) {
                    const perfil = perfilDoc.data();

                    // Solo equipos SIN grupo
                    if (perfil.grupo) continue;

                    const esActivo = (perfil.activo === true || perfil.activo === "true" || perfil.activo === undefined);
                    if (!esActivo) continue;

                    // Leer movimientos
                    let movSnap = await perfilDoc.ref.collection('MOVIMIENTOS').get();
                    if (movSnap.empty) movSnap = await perfilDoc.ref.collection('movimientos').get();

                    movSnap.forEach(movDoc => {
                        const mov = movDoc.data();
                        if (mov.tipo === 'venta' || !mov.tipo) {
                            const status = mov.status || '';
                            const saldoPendiente = parseFloat(mov.saldoPendiente || 0);

                            let saldo = 0;
                            if (saldoPendiente > 0) {
                                saldo = saldoPendiente;
                            } else if (status === 'pendiente' || status === '') {
                                const total = parseFloat(mov.total || 0);
                                const abonos = mov.abonos && Array.isArray(mov.abonos)
                                    ? mov.abonos.reduce((sum, a) => sum + parseFloat(a.monto || 0), 0)
                                    : 0;
                                saldo = Math.max(0, total - abonos);
                            }

                            if (saldo > 0.01) {
                                facturas.push({
                                    equipoNumero: perfil.numero,
                                    equipoNombre: mov.clientName || perfil.nombre || `Equipo ${perfil.numero}`,
                                    saldo: saldo,
                                    ciudad: perfil.grupo || ''
                                });
                            }
                        }
                    });
                }

                // Ordenar por número de equipo
                facturas.sort((a, b) => {
                    const numA = parseInt(String(a.equipoNumero).replace(/\D/g, '')) || 0;
                    const numB = parseInt(String(b.equipoNumero).replace(/\D/g, '')) || 0;
                    return numA - numB;
                });

                // Renderizar
                grid.innerHTML = facturas.map(f => `
                    <div class="factura-card local" onclick="verDetalle('${f.equipoNumero}')" style="cursor:pointer; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:15px; background:white; border:2px solid #3498db; border-radius:8px;">
                        <div style="font-size: 2rem; font-weight:bold; color:#2c3e50;">${f.equipoNumero}</div>
                        ${f.equipoNombre !== `Equipo ${f.equipoNumero}` ? `<div style="font-size:0.8rem; color:#e74c3c; margin:5px 0;">${f.equipoNombre}</div>` : ''}
                        <div style="font-size: 1.1rem; color:#27ae60; font-weight:600;">${formatCurrency(f.saldo)}</div>
                    </div>
                `).join('');

            } catch (error) {
                console.error("Error:", error);
                grid.innerHTML = '<p>Error cargando facturas</p>';
            }
        }

        function verDetalle(numero) {
            window.location.href = `detalle_equipo.html?numero=${numero}`;
        }

        document.addEventListener('DOMContentLoaded', cargarFacturasIndividuales);
    </script>
</body>

</html>
