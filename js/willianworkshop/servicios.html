<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servicios - Taller Wilian</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/servicios.css">
</head>

<body class="main-wrapper">

    <header>
        <button class="menu-toggle" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
        <h1>Taller Willian</h1>
        <div class="header-actions">
            <!-- Sin carrito -->
        </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
        <a href="venta.html"><i class="fas fa-cash-register"></i> Nueva Venta</a>
        <a href="facturas.html"><i class="fas fa-file-invoice-dollar"></i> Facturas Pendientes</a>
        <a href="historial.html"><i class="fas fa-history"></i> Historial de Ventas</a>
        <a href="inventario.html"><i class="fas fa-boxes"></i> Inventario</a>
        <a href="servicios.html" class="active"><i class="fas fa-tools"></i> Servicios</a>
        <a href="entregas.html"><i class="fas fa-truck"></i> Entregas</a>
        <a href="cuentas.html"><i class="fas fa-sticky-note"></i> Memos y Cuentas</a>
        <a href="configuracion.html"><i class="fas fa-cog"></i> Configuración</a>
        <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
    </div>

    <div class="container">
        <div class="dashboard-section">
            <div class="section-title">SERVICIOS</div>

            <!-- 🔥 Contenedor con ancho completo -->
            <div class="servicios-wrapper">
                <div class="servicios-actions">
                    <div>
                        <button class="btn btn-success" id="agregar-servicio-btn"><i class="fas fa-plus"></i> AGREGAR
                            SERVICIO</button>
                    </div>
                    <div class="form-group">
                        <input type="text" id="buscar-servicio" placeholder="Buscar servicio...">
                    </div>
                </div>

                <div class="servicios-grid" id="servicios-container">
                    <!-- Se llenará dinámicamente -->
                </div>

                <div class="empty-cart" id="empty-servicios" style="display: none;">
                    <i class="fas fa-tools" style="font-size:2rem;margin-bottom:10px;opacity:.5;"></i>
                    <div>No hay servicios registrados</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/controllers/ServicesController.js"></script>
</body>

</html>
