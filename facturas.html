<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facturas - Taller Wilian</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/facturas.css">
</head>

<body class="main-wrapper">

    <header>
        <button class="menu-toggle" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
        <h1>Taller Willian</h1>
        <div class="header-actions">
            <!-- Acciones futuras -->
        </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
        <a href="venta.html"><i class="fas fa-cash-register"></i> Nueva Venta</a>
        <a href="facturas.html" class="active"><i class="fas fa-file-invoice-dollar"></i> Facturas Pendientes</a>
        <a href="historial.html"><i class="fas fa-history"></i> Historial de Ventas</a>
        <a href="inventario.html"><i class="fas fa-boxes"></i> Inventario</a>
        <a href="servicios.html"><i class="fas fa-tools"></i> Servicios</a>
        <a href="entregas.html"><i class="fas fa-truck"></i> Entregas</a>
        <a href="cuentas.html"><i class="fas fa-sticky-note"></i> Memos y Cuentas</a>
        <a href="configuracion.html"><i class="fas fa-cog"></i> Configuración</a>
        <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
    </div>

    <div class="container">
        <div class="dashboard-section">
            <div class="section-title">FACTURAS PENDIENTES</div>

            <div class="facturas-wrapper">
                <div class="facturas-grid" id="facturas-container">
                    <!-- Se llena dinámicamente -->
                </div>

                <div class="empty-state" id="empty-facturas" style="display: none;">
                    <i class="fas fa-file-invoice-dollar"></i>
                    <div>No hay facturas pendientes</div>
                </div>

                <div class="grupos-container" id="grupos-container">
                    <!-- Se llena dinámicamente -->
                </div>

                <div class="empty-state" id="empty-grupos" style="display: none;">
                    <i class="fas fa-users"></i>
                    <div>No hay grupos creados</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Logout handler simple inline 
        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            localStorage.removeItem('usuarioLogueado');
            window.location.href = 'login.html';
        });
    </script>
    <script type="module" src="js/controllers/InvoiceController.js"></script>
</body>

</html>
